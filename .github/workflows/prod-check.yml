name: prod-check
on:
  workflow_dispatch:

# Installs the actual hook-free production APK from the latest public release
# on an emulator and verifies launch, the production sign-in page, and the
# native Check-for-updates control. No credentials, no QA hooks.

jobs:
  prod-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download latest production APK
        run: |
          URL=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r '.assets[] | select(.name | endswith(".apk")) | .browser_download_url')
          echo "production APK: $URL"
          curl -sL -o prod.apk "$URL"
          ls -la prod.apk
      - name: Enable KVM (GitHub-hosted Linux runner)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Emulator check
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: |
            python3 $GITHUB_WORKSPACE/qa/prod_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prod-check-output
          path: qa-out/
