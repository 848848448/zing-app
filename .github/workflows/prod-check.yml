name: prod-check
on:
  workflow_dispatch:

# Installs the actual hook-free production APK from the latest public release
# on an emulator and verifies launch, the production sign-in page, and the
# native Check-for-updates control. No credentials, no QA hooks.

jobs:
  prod-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download latest and previous production APKs
        run: |
          curl -s https://api.github.com/repos/${{ github.repository }}/releases?per_page=2 > /tmp/releases.json
          URL=$(jq -r '.[0].assets[] | select(.name | endswith(".apk")) | .browser_download_url' /tmp/releases.json)
          PREV=$(jq -r '.[1].assets[] | select(.name | endswith(".apk")) | .browser_download_url' /tmp/releases.json)
          echo "latest: $URL"; echo "previous: $PREV"
          curl -sL -o prod.apk "$URL"
          curl -sL -o prev.apk "$PREV"
          ls -la prod.apk prev.apk
      - name: Enable KVM (GitHub-hosted Linux runner)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install emulator + system image
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          for i in 1 2 3; do
            sudo rm -rf "$ANDROID_HOME/.temp" "$ANDROID_HOME/system-images/android-34" 2>/dev/null || true
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "emulator" "system-images;android-34;google_apis;x86_64" && break
            echo "sdkmanager attempt $i failed, retrying"; sleep 5
          done
          ls "$ANDROID_HOME/system-images/android-34/google_apis/x86_64/" | head -5
      - name: Boot emulator and run production check
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager --verbose create avd --force --name zingqa --package "system-images;android-34;google_apis;x86_64" 2>&1 | tail -25
          [ -f "$ANDROID_AVD_HOME/zingqa.ini" ] || { echo "AVD-INI-MISSING"; exit 1; }
          nohup $ANDROID_HOME/emulator/emulator -avd zingqa -no-window -no-boot-anim -accel on -gpu swiftshader_indirect -no-snapshot-save -verbose >/tmp/emulator.log 2>&1 &
          sleep 5; tail -5 /tmp/emulator.log || true
          timeout 180 adb wait-for-device || { echo "ADB-WAIT-TIMEOUT"; tail -40 /tmp/emulator.log; exit 1; }
          timeout 240 bash -c 'until adb shell getprop sys.boot_completed 2>/dev/null | grep -q 1; do sleep 2; done' || { echo "BOOT-TIMEOUT"; tail -40 /tmp/emulator.log; exit 1; }
          # Let first-boot Google services/provider updates settle before install.
          sleep 60
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
          adb shell settings put system screen_off_timeout 1800000
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          python3 $GITHUB_WORKSPACE/qa/prod_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prod-check-output
          path: qa-out/

