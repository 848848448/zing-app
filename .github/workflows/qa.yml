name: qa
on:
  workflow_dispatch:

permissions:
  contents: write

# Full QA: install b1, verify launch + update control, play a local looping
# audio fixture (no site credentials) and verify playback time keeps advancing
# across backgrounding with the foreground-service notification up, check the
# production sign-in page renders, then update b1 -> b2 through the in-app
# updater. The QA b2 is a temporary prerelease, deleted after the run; the
# production b2 ships separately from the build workflow (QA hooks off).
# Needs secrets: KEYSTORE_B64, KEYSTORE_PASSWORD.
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK packages (preinstalled on ubuntu-latest)
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Build + sign b1 and b2 (QA hooks enabled)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          QA_MODE: '1'
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/zing.jks"
          BUILD_NO=1 VERSION_NAME=1.0-b1 bash build.sh
          KEYSTORE="$RUNNER_TEMP/zing.jks" KEY_ALIAS=zing BUILD_NO=1 VERSION_NAME=1.0-b1 bash sign.sh
          mv Zing-1.0-b1.apk qa-b1.apk
          BUILD_NO=2 VERSION_NAME=1.0-b2 bash build.sh
          KEYSTORE="$RUNNER_TEMP/zing.jks" KEY_ALIAS=zing BUILD_NO=2 VERSION_NAME=1.0-b2 bash sign.sh
          mv Zing-1.0-b2.apk qa-b2.apk
      - name: Publish b2 as latest release (update target)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-b2
          name: Zing v1.0-b2 (QA fixture - temporary)
          prerelease: true
          files: qa-b2.apk
      - name: Enable KVM (GitHub-hosted Linux runner)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Install emulator + system image
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          for i in 1 2 3; do
            sudo rm -rf "$ANDROID_HOME/.temp" "$ANDROID_HOME/system-images/android-34" 2>/dev/null || true
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "emulator" "system-images;android-34;google_apis;x86_64" && break
            echo "sdkmanager attempt $i failed, retrying"; sleep 5
          done
          ls "$ANDROID_HOME/system-images/android-34/google_apis/x86_64/" | head -5
      - name: Boot emulator and run QA
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          printf 'no\n' | $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager --verbose create avd --force --name zingqa --package "system-images;android-34;google_apis;x86_64" 2>&1 | tail -25
          ls -la ~/.android/avd/ || true
          $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager list avd || true
          [ -f ~/.android/avd/zingqa.ini ] || { echo "AVD-INI-MISSING"; find $HOME -name "zingqa.ini" 2>/dev/null | head -3; exit 1; }
          nohup $ANDROID_HOME/emulator/emulator -avd zingqa -no-window -no-boot-anim -accel on -gpu swiftshader_indirect -no-snapshot-save -verbose >/tmp/emulator.log 2>&1 &
          sleep 5; tail -5 /tmp/emulator.log || true
          timeout 180 adb wait-for-device || { echo "ADB-WAIT-TIMEOUT"; tail -40 /tmp/emulator.log; exit 1; }
          timeout 240 bash -c 'until adb shell getprop sys.boot_completed 2>/dev/null | grep -q 1; do sleep 2; done' || { echo "BOOT-TIMEOUT"; tail -40 /tmp/emulator.log; exit 1; }
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          python3 $GITHUB_WORKSPACE/qa/run.py
      - name: Remove temporary QA release
        if: always()
        run: gh release delete v1.0-b2 --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-output
          path: qa-out/
