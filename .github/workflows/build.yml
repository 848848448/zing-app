name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK packages (preinstalled on ubuntu-latest)
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Build unsigned APK
        env:
          BUILD_NO: ${{ github.run_number }}
        run: ./build.sh
      - name: Decode signing key
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/zing.jks"
      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE: ${{ runner.temp }}/zing.jks
          BUILD_NO: ${{ github.run_number }}
        run: ./sign.sh
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-b${{ github.run_number }}
          name: Zing v1.0-b${{ github.run_number }}
          files: Zing-1.0-b${{ github.run_number }}.apk
          generate_release_notes: false
